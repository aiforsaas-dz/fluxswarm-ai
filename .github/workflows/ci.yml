name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluxswarm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fluxswarm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI runs in Demo/dev mode so `import main` and the suite work without
      # production secrets; production-mode failure paths are unit-tested.
      FLUXSWARM_DEMO_MODE: "1"
      # Phase 1: run the SQLite->PostgreSQL parity + Alembic migration suite
      # against the ephemeral service container. Port 5432 is published to the
      # host (``-p 5432:5432``), so DNS runs on the VM must use localhost — the
      # ``postgres`` service label only resolves inside docker's own network.
      FLUXSWARM_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fluxswarm_test
      # Phase 3: pin the hermetic file-KMS backend so the suite never touches a
      # real keyring.
      FLUXSWARM_KMS_BACKEND: file
      FLUXSWARM_KMS_FILE_KEY: ci-test-passphrase-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r backend/requirements.txt pytest
      - name: Import check
        run: python -c "import main"
        working-directory: backend
      - name: Lint (syntax)
        run: python -m py_compile main.py hermes_client.py hermes_docker.py kms_client.py db.py db_postgres.py serverlock.py
        working-directory: backend
      - name: Run tests
        run: python -m pytest backend/tests -q
      - name: Secret-leak static scan
        run: |
          # Test fixtures are excluded by policy: backend/tests intentionally
          # contains synthetic AWS/anthropic credential lookalikes for the
          # security._static_scan detection unit tests; that detection behavior
          # itself is verified green by the pytest suite above.
          if grep -rnI \
              -e 'pdl_\(sdbx\|live\)_apikey_[A-Za-z0-9]' \
              -e 'pdl_ntfset_[A-Za-z0-9]' \
              -e 'sk-ant-[A-Za-z0-9]\{20,\}' \
              -e 'AKIA[0-9A-Z]\{16\}' \
              -e -- '-----BEGIN \(RSA \|EC \|OPENSSH \)\?PRIVATE KEY-----' \
              --exclude=.env.example --exclude-dir=.git --exclude-dir=tests \
              --include='*.py' --include='*.sh' --include='*.yml' --include='*.yaml' --include='*.json' --include='*.toml' \
              . ; then
            echo "SECRET LEAK FOUND"
            exit 1
          fi
          echo "no real credentials present"
  docker:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fluxswarm:ci .